---
- name: include variables relevant to install type ( binary )
  include_vars: binary_install.yml
  when: not tomcat_install_from_repo
  tags: ['tomcat']

- name: include variables relevant to install type ( rpm )
  include_vars: package_install.yml
  when: tomcat_install_from_repo
  tags: ['tomcat']

- name: ensure tomcat is installed (binary)
  include_tasks: install.yml
  when: not tomcat_install_from_repo
  tags: ['tomcat']

- name: ensure tomcat is installed (rpm)
  include_tasks: install_repo.yml
  when: tomcat_install_from_repo
  tags: ['tomcat']

- name: Add tomcat user to tomcat group if configured
  user:
    name: "{{ tomcat_user }}"
    append: true
    groups: ["{{ tomcat_group }}"]
  when: tomcat_add_user_to_group
  tags: ['tomcat']
  
# Without this, the set_fact below mints a new random value on every run, so
# server.xml is rewritten every time (and the on-disk value drifts from the
# running one, since nothing restarts tomcat for a server.xml change).
- name: read any existing tomcat shutdown value
  ansible.builtin.command:
    cmd: sed -n 's/.*<Server[^>]*shutdown="\([^"]*\)".*/\1/p' {{ _tomcat_catalina_base }}/conf/server.xml
  register: tomcat_shutdown_existing
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ['tomcat']

- name: preserve the existing tomcat shutdown value
  ansible.builtin.set_fact:
    tomcat_shutdown_value: "{{ tomcat_shutdown_existing.stdout_lines | first }}"
  when:
    - tomcat_shutdown_value == "SETME"
    - tomcat_shutdown_existing.stdout_lines | default([]) | length > 0
  tags: ['tomcat']

- set_fact:
    tomcat_shutdown_value: "{{ lookup('password', '/dev/null length=20 chars=ascii_letters') }}"
  when: tomcat_shutdown_value == "SETME"
  tags: ['tomcat']

- name: give tomcat group access to read all in CATALINA_HOME
  command: "find {{ _tomcat_catalina_home }}/ -exec /bin/chgrp {{ tomcat_group }} {} \\;"
  tags: ['tomcat']
  changed_when: false
  
- name: restrict access to CATALINA_HOME
  file: path="{{ _tomcat_catalina_home }}" state=directory owner="root" group="{{ tomcat_group }}" mode='0750'
  tags: ['tomcat']

- name: ensure logs directory exists in CATALINA_HOME
  file: path="{{ _tomcat_catalina_home }}/logs" state=directory owner="{{ tomcat_user }}" group="{{ tomcat_group }}" mode='0750'
  tags: ['tomcat']

- name: create CATALINA_BASE dirs
  file: path="{{ item }}" state=directory owner="{{ tomcat_user }}" group="{{ tomcat_group }}" mode='0751'
  with_items:
    - '{{ _tomcat_catalina_base }}'
    - '{{ _tomcat_catalina_base }}/bin'
    - '{{ _tomcat_catalina_base }}/logs'
    - '{{ _tomcat_catalina_base }}/conf'
    - '{{ _tomcat_catalina_base }}/webapps'
    - '{{ _tomcat_catalina_base }}/temp'
    - '{{ _tomcat_catalina_base }}/classes'
    - '{{ _tomcat_catalina_base }}/lib'
  tags: ['tomcat']

- name: check if tomcat conf dir has been copied before
  stat: path={{ _tomcat_catalina_base }}/conf/context.xml
  register: tomcat_conf_found
  tags: ['tomcat']

- name: copy tomcat conf.dist folder
  shell: "/bin/cp -R /usr/local/tomcat/conf.dist/* {{ _tomcat_catalina_base }}/conf"
  when: tomcat_conf_found.stat.exists == false
  tags: ['tomcat']

# The conf.dist copy above only runs on initial provisioning, so conf/web.xml
# would otherwise keep its original base forever and drift from the installed
# Tomcat version. Stamping with conf.dist's checksum (rather than
# tomcat_version) keeps this correct even if the stamp and the installed
# distribution get out of step. Skipped for rpm installs, which have no
# conf.dist.
- name: check for the tomcat distribution's stock web.xml
  ansible.builtin.stat:
    path: "{{ _tomcat_catalina_home }}/conf.dist/web.xml"
    checksum_algorithm: sha1
  register: tomcat_webxml_dist
  when: tomcat_manage_webxml_baseline
  tags: ['tomcat']

- name: check whether catalina base web.xml is present
  ansible.builtin.stat:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
  register: tomcat_webxml_current
  when: tomcat_manage_webxml_baseline
  tags: ['tomcat']

- name: check the web.xml baseline stamp
  ansible.builtin.command:
    cmd: grep -q "ANSIBLE MANAGED WEBXML BASELINE {{ tomcat_webxml_dist.stat.checksum }}" {{ _tomcat_catalina_base }}/conf/web.xml
  register: tomcat_webxml_stamp
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - tomcat_manage_webxml_baseline
    - tomcat_webxml_dist.stat.exists | default(false)
    - tomcat_webxml_current.stat.exists | default(false)
  tags: ['tomcat']

- name: refresh web.xml from the tomcat distribution
  ansible.builtin.copy:
    src: "{{ _tomcat_catalina_home }}/conf.dist/web.xml"
    remote_src: true
    dest: "{{ _tomcat_catalina_base }}/conf/web.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  when:
    - tomcat_manage_webxml_baseline
    - tomcat_webxml_dist.stat.exists | default(false)
    - tomcat_webxml_current.stat.exists | default(false)
    - tomcat_webxml_stamp.rc | default(1) != 0
  tags: ['tomcat']

- name: stamp web.xml with its baseline checksum
  ansible.builtin.lineinfile:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
    insertbefore: "</web-app>"
    line: "<!-- ANSIBLE MANAGED WEBXML BASELINE {{ tomcat_webxml_dist.stat.checksum }} -->"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  when:
    - tomcat_manage_webxml_baseline
    - tomcat_webxml_dist.stat.exists | default(false)
    - tomcat_webxml_current.stat.exists | default(false)
    - tomcat_webxml_stamp.rc | default(1) != 0
  tags: ['tomcat']

- name: Add HTTP Header Security Filter to web.xml
  ansible.builtin.blockinfile:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
    insertbefore: "</web-app>"
    marker: "<!-- {mark} ANSIBLE MANAGED HTTP HEADER SECURITY FILTER -->"
    block: |
      <filter>
        <filter-name>httpHeaderSecurity</filter-name>
        <filter-class>org.apache.catalina.filters.HttpHeaderSecurityFilter</filter-class>
        <init-param>
          <param-name>antiClickJackingOption</param-name>
          <param-value>SAMEORIGIN</param-value>
        </init-param>
      </filter>
      <filter-mapping>
        <filter-name>httpHeaderSecurity</filter-name>
        <url-pattern>/*</url-pattern>
        <dispatcher>REQUEST</dispatcher>
      </filter-mapping>
  when: tomcat_secure_http_headers
  tags: ['tomcat']

# Declared after the httpHeaderSecurity block so that filter keeps precedence in
# the chain. `state` is driven by the list so emptying it removes the block
# rather than orphaning it. Registered (rather than notifying a handler) so
# consumers can decide whether a web.xml change warrants a restart.
- name: manage extra web.xml filters
  ansible.builtin.blockinfile:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
    insertbefore: "</web-app>"
    marker: "<!-- {mark} ANSIBLE MANAGED EXTRA FILTERS -->"
    state: "{{ 'present' if tomcat_extra_filters else 'absent' }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
    block: |
      {% for f in tomcat_extra_filters %}
      <filter>
          <filter-name>{{ f.name }}</filter-name>
          <filter-class>{{ f.class }}</filter-class>
      {% for p in f.init_params | default([]) %}
          <init-param>
              <param-name>{{ p.name }}</param-name>
              <param-value>{{ p.value }}</param-value>
          </init-param>
      {% endfor %}
      </filter>
      <filter-mapping>
          <filter-name>{{ f.name }}</filter-name>
          <url-pattern>{{ f.url_pattern | default('/*') }}</url-pattern>
      {% for d in f.dispatchers | default(['REQUEST']) %}
          <dispatcher>{{ d }}</dispatcher>
      {% endfor %}
      </filter-mapping>
      {% endfor %}
  register: tomcat_extra_filters_webxml
  tags: ['tomcat']

- name: Ensure cookie-config element exists in session-config
  community.general.xml:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
    xpath: /javaee:web-app/javaee:session-config/javaee:cookie-config
    namespaces:
      javaee: http://xmlns.jcp.org/xml/ns/javaee
    state: present
  when: tomcat_secure_session_cookie
  tags: ['tomcat']

- name: Set http-only flag on session cookie
  community.general.xml:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
    xpath: /javaee:web-app/javaee:session-config/javaee:cookie-config/javaee:http-only
    namespaces:
      javaee: http://xmlns.jcp.org/xml/ns/javaee
    value: "true"
  when: tomcat_secure_session_cookie
  tags: ['tomcat']

- name: Set secure flag on session cookie
  community.general.xml:
    path: "{{ _tomcat_catalina_base }}/conf/web.xml"
    xpath: /javaee:web-app/javaee:session-config/javaee:cookie-config/javaee:secure
    namespaces:
      javaee: http://xmlns.jcp.org/xml/ns/javaee
    value: "true"
  when: tomcat_secure_session_cookie
  tags: ['tomcat']

- name: secure catalina base config files
  file:
    path: '{{ _tomcat_catalina_base }}/conf/{{ item }}'
    owner: '{{ tomcat_user }}'
    group: '{{ tomcat_group }}'
    mode: '0640'
  with_items:
    - catalina.policy
    - catalina.properties
    - web.xml
    - jaspic-providers.xml
  tags: ['tomcat']

- name: ensure tomcat server.xml exists
  template:
    src: catalina_base.conf.server.xml.j2
    dest: "{{ _tomcat_catalina_base }}/conf/server.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  tags: ['tomcat']

- name: create host config directory for tomcat rewrite rules (if applicable)
  file:
    path: "{{ _tomcat_catalina_base }}/conf/Catalina/{{ tomcat_default_host }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0750'
  when: tomcat_rewrite_rules|length > 0
  tags: ['tomcat']

- name: ensure tomcat rewrite rules are placed (if applicable)
  copy:
    content: "{{ tomcat_rewrite_rules | join('\n')}}"
    dest: "{{ _tomcat_catalina_base }}/conf/Catalina/{{ tomcat_default_host }}/rewrite.config"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  when: tomcat_rewrite_rules|length > 0
  tags: ['tomcat']

- name: create defaultHost directory
  file: path="{{ _tomcat_catalina_base }}/conf/Catalina/{{ tomcat_default_host }}" state=directory owner="{{ tomcat_user }}" group="{{ tomcat_group }}" mode='0750'
  tags: ['tomcat']

- name: ensure tomcat manager.xml exists
  template:
    src: catalina_base.conf.Catalina.defaultHost.manager.xml.j2
    dest: "{{ _tomcat_catalina_base }}/conf/Catalina/{{ tomcat_default_host }}/manager.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  when: tomcat_enable_manager
  tags: ['tomcat']

- name: ensure tomcat-users.xml exists
  template:
    src: catalina_base.conf.tomcat-users.xml.j2
    dest: "{{ _tomcat_catalina_base }}/conf/tomcat-users.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  tags: ['tomcat']

- name: ensure logging.properties exists
  template:
    src: catalina_base.conf.logging.properties.j2
    dest: "{{ _tomcat_catalina_base }}/conf/logging.properties"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: 0600
  tags: ['tomcat']

- name: ensure context directory exists
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0750'
  with_items:
    - "{{ _tomcat_catalina_base }}/conf/Catalina/"
    - "{{ _tomcat_catalina_base }}/conf/Catalina/{{ tomcat_default_host }}"
  tags: ['tomcat']

- name: create pre-defined global contexts
  template:
    src: catalina_base.conf.context.xml.j2
    dest: "{{ _tomcat_catalina_base }}/conf/context.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0640'
  tags: ['tomcat']

- name: create pre-defined webapp contexts
  template:
    src: catalina_base.conf.Catalina.context.xml.j2
    dest: "{{ _tomcat_catalina_base }}/conf/Catalina/{{ tomcat_default_host }}/{{ item.name }}.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: '0750'
  with_items: "{{ tomcat_contexts }}"
  when: tomcat_contexts[0]
  tags: ['tomcat']

- name: allow user to restart tomcat service via sudo
  template:
    src: etc.sudoers.d.tomcat.j2
    dest: /etc/sudoers.d/tomcat
    owner: root
    group: root
    mode: '0640'
  when: tomcat_allow_user_restart
  tags: ['tomcat']

- name: ensure collectd jvm package is installed
  yum:
    name: ['collectd-java','collectd-generic-jmx']
    state: present
  notify: restart collectd
  when: tomcat_enable_collectd
  tags: ['tomcat', 'collectd']

- name: place collectd jvm config
  template: src=etc.collectd.d.jvm.conf.j2 dest=/etc/collectd.d/jvm.conf owner=root group="{{ base_collectd_user }}" mode=0640
  notify: restart collectd
  when: tomcat_enable_collectd
  tags: ['tomcat', 'collectd']

- name: place catalina.out logrotate configuration
  template: src=etc.logrotate.tomcat.j2 dest=/etc/logrotate.d/tomcat owner=root group=root mode=0644
  tags: ['tomcat', 'logrotate']

# binary only tasks
- name: ensure tomcat setenv.sh exists
  template:
    src: catalina_base.bin.setenv.sh.j2
    dest: "{{ _tomcat_catalina_base }}/bin/setenv.sh"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: 0600
  when: not tomcat_install_from_repo
  tags: ['tomcat']

# rpm only tasks

- name: ensure tomcat env var file exists
  template:
    src: etc.sysconfig.tomcat.j2
    dest: "/etc/sysconfig/{{ _tomcat_service }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: 0600
  when: tomcat_install_from_repo
  tags: ['tomcat']

- name: ensure tomcat is started
  service: 
    name: "{{ _tomcat_service }}"
    enabled: true
    state: started
  when: tomcat_start_service
  tags: ['tomcat']
